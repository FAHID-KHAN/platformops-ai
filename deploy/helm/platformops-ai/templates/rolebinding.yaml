{{- if not .Values.rbac.clusterWide }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "platformops-ai.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "platformops-ai.fullname" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "platformops-ai.fullname" . }}
{{- end }}

