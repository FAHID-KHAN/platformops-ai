[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "platformops-ai"
version = "0.6.1"
description = "Read-only platform operations CLI and MCP server for Kubernetes, Prometheus, ArgoCD, and Jenkins investigation."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "PlatformOps AI Contributors" }]
dependencies = [
  "kubernetes>=30.0.0",
  "mcp>=1.0.0",
]
keywords = [
  "aiops",
  "argocd",
  "jenkins",
  "kubernetes",
  "mcp",
  "observability",
  "platform-engineering",
  "prometheus",
  "read-only",
  "sre",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Monitoring",
  "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/FAHID-KHAN/platformops-ai"
Repository = "https://github.com/FAHID-KHAN/platformops-ai"
Issues = "https://github.com/FAHID-KHAN/platformops-ai/issues"
Changelog = "https://github.com/FAHID-KHAN/platformops-ai/blob/main/CHANGELOG.md"
Documentation = "https://github.com/FAHID-KHAN/platformops-ai/tree/main/docs"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]
kubernetes = []
mcp = []

[project.scripts]
platformops = "platformops.cli:main"
platformops-mcp-k8s = "platformops.mcp.kubernetes_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
  "homelab: tests that require private infrastructure",
  "integration: tests that require an external runtime such as kind or k3d",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["src/platformops"]
