[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "platformops-ai"
version = "0.1.0"
description = "Read-only, model-agnostic MCP tools for evidence-grounded platform operations."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "PlatformOps AI Contributors" }]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
kubernetes = ["kubernetes>=30.0.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
platformops-mcp-k8s = "platformops.mcp.kubernetes_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
  "homelab: tests that require private infrastructure",
  "integration: tests that require an external runtime such as kind or k3d",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["src/platformops"]
